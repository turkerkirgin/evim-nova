<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Evim Nova – tanıtım</title>
<!-- 14 s promo, 1920×1080. Every animation is a CSS animation; video/render.py pauses them and seeks frame by frame
     (document.getAnimations() → currentTime), so the result is the same on every machine. ?lang=en for English.
     Screens come from docs/gorseller (dev/shots.py). Open in a browser with ?play to watch it live. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root{--bg:#f2f3f5;--ink:#111214;--sub:#6e6e73;--accent:#f2b63a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000}
  .scene{position:absolute;inset:0;opacity:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .light{background:var(--bg)}
  .dark{background:#000}
  .t{position:absolute;left:0;right:0;text-align:center;color:var(--ink);font-weight:600;letter-spacing:-1.2px}
  .dark .t{color:#f5f5f7}
  .t.big{font-size:84px;letter-spacing:-3px;font-weight:700}
  .t.mid{font-size:52px}
  img{display:block}

  /* devices */
  .tablet{position:absolute;width:1040px;height:666px;border-radius:44px;background:#0b0b0d;padding:18px;box-shadow:0 60px 120px rgba(0,0,0,.28),0 0 0 2px #2a2b2f inset}
  .tablet img{width:100%;height:100%;object-fit:cover;border-radius:28px}
  .laptop{position:absolute;width:1180px}
  .laptop .scr{width:1180px;height:686px;border-radius:26px 26px 0 0;background:#0b0b0d;padding:16px 16px 22px;box-shadow:0 50px 110px rgba(0,0,0,.25)}
  .laptop .scr img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .laptop .base{width:1320px;height:26px;margin-left:-70px;border-radius:0 0 26px 26px;background:linear-gradient(#d9dadd,#a7a9ae)}
  .phone{position:absolute;width:318px;height:672px;border-radius:56px;background:#0b0b0d;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.3),0 0 0 2px #2a2b2f inset}
  .phone img{width:100%;height:100%;object-fit:cover;border-radius:44px}
  .phone::after{content:"";position:absolute;top:24px;left:50%;width:96px;height:28px;margin-left:-48px;border-radius:20px;background:#000}
  .theme{position:absolute;left:16px;top:16px;width:calc(100% - 32px);height:calc(100% - 38px);opacity:0}

  /* keyframes */
  @keyframes show{from{opacity:1}to{opacity:1}}
  @keyframes blurIn{from{opacity:0;filter:blur(28px);transform:scale(1.06)}to{opacity:1;filter:blur(0);transform:none}}
  @keyframes blurOut{from{opacity:1;filter:blur(0)}to{opacity:0;filter:blur(24px)}}
  @keyframes rise{from{opacity:0;transform:translateY(240px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes riseL{from{opacity:0;transform:translate(-160px,200px) rotate(-6deg)}to{opacity:1;transform:none}}
  @keyframes riseR{from{opacity:0;transform:translate(160px,200px) rotate(6deg)}to{opacity:1;transform:none}}
  @keyframes streak{0%{transform:translateX(-140%) skewX(-24deg);opacity:0}20%{opacity:1}100%{transform:translateX(140%) skewX(-24deg);opacity:0}}
  @keyframes curve{from{stroke-dashoffset:1600}to{stroke-dashoffset:0}}
  @keyframes zoomCards{from{transform:scale(1)}to{transform:scale(1.85)}}
  @keyframes flash{0%{background:#000}10%{background:#6b0000}30%{background:#140000}55%{background:#5a0000}75%{background:#120000}100%{background:#260000}}
  @keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(255,60,60,0)}50%{box-shadow:0 0 120px 20px rgba(255,60,60,.45)}}
  @keyframes slideL{from{transform:translateX(0)}to{transform:translateX(-120px)}}
  @keyframes whipIn{from{transform:translateX(110%);filter:blur(30px)}to{transform:none;filter:blur(0)}}
  @keyframes logoIn{0%{opacity:0;letter-spacing:40px;filter:blur(20px)}100%{opacity:1;letter-spacing:-4px;filter:blur(0)}}
  @keyframes fadeBlack{from{opacity:0}to{opacity:1}}
  @keyframes kenburns{from{transform:scale(1.15)}to{transform:scale(1)}}
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · 0.0–1.6 s: dark, light streak, wordmark -->
  <section class="scene dark" style="animation:show 1.6s 0s forwards">
    <svg width="1920" height="1080" style="position:absolute;inset:0">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <path d="M200 760 Q 960 980 1720 640" fill="none" stroke="url(#g)" stroke-width="3" stroke-dasharray="1600" style="animation:curve 1.1s .05s cubic-bezier(.6,0,.2,1) both"/>
    </svg>
    <div style="position:absolute;inset:-20%;background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);animation:streak 1.2s .2s ease-in-out both"></div>
    <div class="t big" style="font-size:150px;letter-spacing:-6px;animation:blurIn .7s .6s cubic-bezier(.2,.7,.2,1) both,blurOut .3s 1.3s both">Evim Nova</div>
  </section>

  <!-- 2 · 1.6–3.2 s: "Your home. On one screen." + tablet rises -->
  <section class="scene light" style="animation:show 1.6s 1.6s forwards">
    <div class="t mid" style="top:110px;animation:blurIn .5s 1.65s both" data-i18n="Evin. Tek ekranda.">Evin. Tek ekranda.</div>
    <div class="tablet" style="top:250px;animation:rise .8s 1.9s cubic-bezier(.2,.8,.2,1) both"><img src="../docs/gorseller/ana_{lang}.png"></div>
  </section>

  <!-- 3 · 3.2–5.0 s: zoom into the live cards -->
  <section class="scene light" style="animation:show 1.8s 3.2s forwards">
    <div style="position:absolute;inset:0;overflow:hidden;transform-origin:14% 100%;animation:zoomCards 1.8s 3.2s cubic-bezier(.6,0,.2,1) both">
      <img src="../docs/gorseller/ana_{lang}.png" style="width:1920px;height:1080px;object-fit:cover">
    </div>
    <div class="t mid" style="top:70px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);animation:blurIn .5s 3.5s both" data-i18n="Canlı kartlar. Animasyonlu kombi ve klima.">Canlı kartlar. Animasyonlu kombi ve klima.</div>
  </section>

  <!-- 4 · 5.0–6.8 s: seven themes, fast cuts -->
  <section class="scene light" style="animation:show 1.8s 5.0s forwards">
    <div class="t mid" style="top:70px;animation:blurIn .4s 5.05s both" data-i18n="7 tema. Tek dokunuş.">7 tema. Tek dokunuş.</div>
    <div class="laptop" style="top:200px;animation:whipIn .45s 5.0s cubic-bezier(.2,.8,.2,1) both">
      <div class="scr" style="position:relative">
        <img src="../docs/gorseller/tema_cam.png" style="width:100%;height:100%">
        <img class="theme" src="../docs/gorseller/tema_isima.png" style="animation:show .2s 5.55s forwards">
        <img class="theme" src="../docs/gorseller/tema_gece.png" style="animation:show .2s 5.75s forwards">
        <img class="theme" src="../docs/gorseller/tema_gunbatimi.png" style="animation:show .2s 5.95s forwards">
        <img class="theme" src="../docs/gorseller/tema_orman.png" style="animation:show .2s 6.15s forwards">
        <img class="theme" src="../docs/gorseller/tema_neon.png" style="animation:show .2s 6.35s forwards">
        <img class="theme" src="../docs/gorseller/tema_buz.png" style="animation:show .3s 6.55s forwards">
      </div>
      <div class="base"></div>
    </div>
  </section>

  <!-- 5 · 6.8–8.4 s: phones -->
  <section class="scene light" style="animation:show 1.6s 6.8s forwards">
    <div class="t mid" style="top:80px;animation:blurIn .45s 6.85s both" data-i18n="Cebinde de.">Cebinde de.</div>
    <div class="phone" style="top:250px;left:610px;animation:riseL .7s 6.95s cubic-bezier(.2,.8,.2,1) both"><img src="../docs/gorseller/telefon_ana_{lang}.png"></div>
    <div class="phone" style="top:250px;left:990px;animation:riseR .7s 7.1s cubic-bezier(.2,.8,.2,1) both"><img src="../docs/gorseller/telefon_salon_{lang}.png"></div>
  </section>

  <!-- 6 · 8.4–10.0 s: alarm screen, red flashes -->
  <section class="scene dark" style="animation:show 1.6s 8.4s forwards,flash 1.6s 8.4s linear both">
    <div class="t mid" style="top:80px;color:#fff;animation:blurIn .4s 8.5s both" data-i18n="Alarm çalınca, ekran seninle.">Alarm çalınca, ekran seninle.</div>
    <div class="tablet" style="top:260px;animation:rise .55s 8.45s cubic-bezier(.2,.8,.2,1) both,pulseRed .8s 9.0s ease-in-out 2 both"><img src="../docs/gorseller/alarm_{lang}.png"></div>
  </section>

  <!-- 7 · 10.0–11.8 s: every screen -->
  <section class="scene light" style="animation:show 1.8s 10.0s forwards">
    <div class="t mid" style="top:70px;animation:blurIn .45s 10.05s both" data-i18n="Telefon. Tablet. Duvar.">Telefon. Tablet. Duvar.</div>
    <div style="position:absolute;inset:0;animation:slideL 1.8s 10.0s linear both">
      <div style="position:absolute;top:300px;left:120px;width:850px;height:520px;animation:rise .6s 10.05s cubic-bezier(.2,.8,.2,1) both">
        <div class="laptop" style="position:relative;transform:scale(.72);transform-origin:left top"><div class="scr"><img src="../docs/gorseller/salon_{lang}.png"></div><div class="base"></div></div>
      </div>
      <div class="tablet" style="top:330px;left:1000px;width:760px;height:487px;border-radius:36px;padding:14px;animation:rise .6s 10.2s cubic-bezier(.2,.8,.2,1) both"><img src="../docs/gorseller/izgara_{lang}.png" style="border-radius:24px"></div>
      <div class="phone" style="top:390px;left:1660px;width:250px;height:528px;border-radius:44px;padding:10px;animation:rise .6s 10.35s cubic-bezier(.2,.8,.2,1) both"><img src="../docs/gorseller/telefon_ana_{lang}.png" style="border-radius:34px"></div>
    </div>
  </section>

  <!-- 8 · 11.8–14.0 s: logo, link, fade to black -->
  <section class="scene light" style="animation:show 2.2s 11.8s forwards">
    <div style="position:absolute;inset:0;background:url(../docs/ornek-odalar/home.jpg) center/cover;opacity:.16;animation:kenburns 2.2s 11.8s linear both"></div>
    <div class="t big" style="top:380px;font-size:140px;animation:logoIn .8s 11.85s cubic-bezier(.2,.8,.2,1) both">Evim Nova</div>
    <div class="t" style="top:560px;font-size:36px;font-weight:500;color:var(--sub);animation:blurIn .5s 12.3s both" data-i18n="Home Assistant için ücretsiz, açık kaynak panel">Home Assistant için ücretsiz, açık kaynak panel</div>
    <div class="t" style="top:640px;font-size:30px;font-weight:600;color:var(--ink);animation:blurIn .5s 12.6s both">github.com/turkerkirgin/evim-nova</div>
    <div style="position:absolute;inset:0;background:#000;animation:fadeBlack .5s 13.5s both"></div>
  </section>
</div>

<script>
  const EN = {
    "Evin. Tek ekranda.": "Your home. On one screen.",
    "Canlı kartlar. Animasyonlu kombi ve klima.": "Live cards. Animated boiler and AC.",
    "7 tema. Tek dokunuş.": "Seven themes. One tap.",
    "Cebinde de.": "In your pocket, too.",
    "Alarm çalınca, ekran seninle.": "When the alarm goes off, the screen has your back.",
    "Telefon. Tablet. Duvar.": "Phone. Tablet. Wall.",
    "Home Assistant için ücretsiz, açık kaynak panel": "A free, open-source panel for Home Assistant",
  };
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "tr";
  document.documentElement.lang = lang;
  if (lang === "en") for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = EN[el.dataset.i18n] || el.textContent;
  for (const img of document.querySelectorAll("img")) img.src = img.getAttribute("src").replace("{lang}", lang);

  window.DURATION = 14;
  // render.py: pause everything and jump to time t (seconds)
  window.seek = t => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = t * 1000; } };
  window.ready = async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); seek(0); return true; };
  if (new URLSearchParams(location.search).has("play")) {
    const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % window.DURATION); requestAnimationFrame(tick); }; ready().then(tick);
  }
</script>
</body>
</html>
